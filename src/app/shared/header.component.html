<header class="site-header" *transloco="let t">
  <div class="site-header__inner">
    <a routerLink="/" class="site-header__brand" aria-label="Madis Voitk — home">
      <span class="site-header__mark" aria-hidden="true">MV</span>
      <span class="site-header__name">Madis Voitk</span>
    </a>

    <nav class="site-header__nav" [attr.aria-label]="t('nav.home')">
      <a routerLink="/" [routerLinkActiveOptions]="{ exact: true }" routerLinkActive="is-active">
        {{ t('nav.home') }}
      </a>
      <a routerLink="/blog" routerLinkActive="is-active">{{ t('nav.blog') }}</a>
    </nav>

    <div class="site-header__actions">
      <div
        class="lang-switch"
        role="group"
        [attr.aria-label]="t('nav.language')"
      >
        @for (code of available; track code) {
          <button
            type="button"
            class="lang-switch__btn"
            [class.is-active]="active() === code"
            [attr.aria-pressed]="active() === code"
            (click)="setLang(code)"
          >
            {{ code.toUpperCase() }}
          </button>
        }
      </div>

      <button
        type="button"
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="t('nav.toggleTheme')"
        [attr.aria-pressed]="theme() === 'dark'"
      >
        @if (theme() === 'dark') {
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
          </svg>
        } @else {
          <svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" />
          </svg>
        }
      </button>
    </div>
  </div>
</header>
